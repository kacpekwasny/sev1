{{define "topology-figure"}}
{{$slug := .Topo.Slug}}
<figure class="topo" id="topo-{{$slug}}">
  <div class="topo-views" role="group" aria-label="{{tr "Widok topologii"}}">
    {{range .Buttons}}
    <button class="btn small {{if eq .ID $.View}}on{{end}}" title="{{tr .Hint}}"
            hx-get="/topologie/{{$slug}}/widok/{{.ID}}"
            hx-target="#topo-{{$slug}}" hx-swap="outerHTML">{{tr .Label}}</button>
    {{end}}
  </div>

  <svg class="topo-svg" viewBox="0 0 {{.Width}} {{.Height}}" role="img"
       aria-label="{{.Topo.Title}}{{tr ": widok"}} {{tr .View}}">
    {{range .Groups}}
    <g class="topo-group">
      <rect x="{{.X}}" y="{{.Y}}" width="{{.W}}" height="{{.H}}" rx="10"/>
      <text class="group-label" x="{{.LabelX}}" y="{{.LabelY}}">{{tr .Label}}</text>
    </g>
    {{end}}

    {{range .Cables}}
    <g class="cable {{.Class}}">
      <line x1="{{.X1}}" y1="{{.Y1}}" x2="{{.X2}}" y2="{{.Y2}}" stroke-width="{{.Width}}">
        <title>{{tr .Title}}</title>
      </line>
      {{if .Label}}<text class="cable-label" x="{{.LabelX}}" y="{{.LabelY}}">{{tr .Label}}</text>{{end}}
    </g>
    {{end}}

    {{range .Rows}}
    <text class="row-label" x="{{.X}}" y="{{.Y}}">{{tr .Text}}</text>
    {{end}}

    {{range .Nodes}}
    {{$cx := .CX}}
    <g class="node {{.Class}}">
      {{if .Badge}}<text class="badge" x="{{$cx}}" y="{{.BadgeY}}">{{tr .Badge}}</text>{{end}}
      <rect x="{{.X}}" y="{{.Y}}" width="{{.W}}" height="{{.H}}" rx="8">
        <title>{{tr .Title}}</title>
      </rect>
      <text class="name" x="{{$cx}}" y="{{.NameY}}">{{.Name}}</text>
      {{range .Lines}}<text class="{{.Class}}" x="{{$cx}}" y="{{.Y}}">{{tr .Text}}</text>{{end}}
    </g>
    {{end}}
  </svg>

  {{with .Route}}
  <div class="topo-panel">
    <p class="muted">{{.Note}}</p>
    <pre class="term"><code>{{.Command}}
{{.Output}}</code></pre>
  </div>
  {{end}}

  {{if .Table}}
  <div class="topo-panel">
    <p class="muted">{{tr "Adresy łączy lecą po kolei z puli"}} <code>{{.Pool}}</code>{{tr ", po jednym /31 na kabel."}}</p>
    <table class="addrs">
      <thead><tr><th>{{tr "od"}}</th><th>{{tr "port"}}</th><th>{{tr "adres"}}</th><th>{{tr "do"}}</th><th>{{tr "port"}}</th><th>{{tr "adres"}}</th><th>{{tr "sieć"}}</th></tr></thead>
      <tbody>
        {{range .Table}}
        <tr {{if not .Routed}}class="unrouted"{{end}}>
          <td>{{.From}}</td><td class="ip">{{or .FromPort "—"}}</td><td class="ip">{{or .FromIP "—"}}</td>
          <td>{{.To}}</td><td class="ip">{{or .ToPort "—"}}</td><td class="ip">{{or .ToIP "—"}}</td>
          <td class="ip">{{or .Net "—"}}</td>
        </tr>
        {{end}}
      </tbody>
    </table>
    <p class="small muted">{{tr "Łącze bez adresu to zejście z leafa do szafy — tam nie ma sesji BGP,\n      tylko sieć serwerów."}}</p>
  </div>
  {{end}}
</figure>
{{end}}
