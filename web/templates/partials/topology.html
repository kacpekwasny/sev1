{{define "topology-figure"}}
{{$slug := .Topo.Slug}}
<figure class="topo" id="topo-{{$slug}}">
  <div class="topo-views" role="group" aria-label="Widok topologii">
    {{range .Buttons}}
    <button class="btn small {{if eq .ID $.View}}on{{end}}" title="{{.Hint}}"
            hx-get="/topologie/{{$slug}}/widok/{{.ID}}"
            hx-target="#topo-{{$slug}}" hx-swap="outerHTML">{{.Label}}</button>
    {{end}}
  </div>

  <svg class="topo-svg" viewBox="0 0 {{.Width}} {{.Height}}" role="img"
       aria-label="{{.Topo.Title}}: widok {{.View}}">
    {{range .Groups}}
    <g class="topo-group">
      <rect x="{{.X}}" y="{{.Y}}" width="{{.W}}" height="{{.H}}" rx="10"/>
      <text class="group-label" x="{{.LabelX}}" y="{{.LabelY}}">{{.Label}}</text>
    </g>
    {{end}}

    {{range .Cables}}
    <g class="cable {{.Class}}">
      <line x1="{{.X1}}" y1="{{.Y1}}" x2="{{.X2}}" y2="{{.Y2}}" stroke-width="{{.Width}}">
        <title>{{.Title}}</title>
      </line>
      {{if .Label}}<text class="cable-label" x="{{.LabelX}}" y="{{.LabelY}}">{{.Label}}</text>{{end}}
    </g>
    {{end}}

    {{range .Rows}}
    <text class="row-label" x="{{.X}}" y="{{.Y}}">{{.Text}}</text>
    {{end}}

    {{range .Nodes}}
    {{$cx := .CX}}
    <g class="node {{.Class}}">
      {{if .Badge}}<text class="badge" x="{{$cx}}" y="{{.BadgeY}}">{{.Badge}}</text>{{end}}
      <rect x="{{.X}}" y="{{.Y}}" width="{{.W}}" height="{{.H}}" rx="8">
        <title>{{.Title}}</title>
      </rect>
      <text class="name" x="{{$cx}}" y="{{.NameY}}">{{.Name}}</text>
      {{range .Lines}}<text class="{{.Class}}" x="{{$cx}}" y="{{.Y}}">{{.Text}}</text>{{end}}
    </g>
    {{end}}
  </svg>

  {{with .Route}}
  <div class="topo-panel">
    <p class="muted">{{.Note}}</p>
    <pre class="term"><code>{{.Command}}
{{.Output}}</code></pre>
  </div>
  {{end}}

  {{if .Table}}
  <div class="topo-panel">
    <p class="muted">Adresy łączy lecą po kolei z puli <code>{{.Pool}}</code>, po jednym /31 na kabel.</p>
    <table class="addrs">
      <thead><tr><th>od</th><th>port</th><th>adres</th><th>do</th><th>port</th><th>adres</th><th>sieć</th></tr></thead>
      <tbody>
        {{range .Table}}
        <tr {{if not .Routed}}class="unrouted"{{end}}>
          <td>{{.From}}</td><td class="ip">{{or .FromPort "—"}}</td><td class="ip">{{or .FromIP "—"}}</td>
          <td>{{.To}}</td><td class="ip">{{or .ToPort "—"}}</td><td class="ip">{{or .ToIP "—"}}</td>
          <td class="ip">{{or .Net "—"}}</td>
        </tr>
        {{end}}
      </tbody>
    </table>
    <p class="small muted">Łącze bez adresu to zejście z leafa do szafy — tam nie ma sesji BGP,
      tylko sieć serwerów.</p>
  </div>
  {{end}}
</figure>
{{end}}
