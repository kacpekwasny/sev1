  note: overlay

- id: route-server
  term: route server
  short: "An intermediary exchanging routes between participants so they do not need a full mesh of sessions."
  note: route-server

- id: full-mesh
  term: full mesh
  short: "Every participant connects to every other participant; connection count grows as n(n−1)/2."
  note: route-server

- id: ipv6
  term: IPv6
  short: "A newer IP protocol version with a very large address space."
  note: ipv6

- id: srv6
