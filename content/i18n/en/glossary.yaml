- id: gpu
  term: GPU
  short: "A processor specialized in parallel computation; model training can use thousands at once."
  note: gpu-clusters

- id: nic
  term: NIC
  short: "A network card or interface through which a server communicates with the network."
  note: gpu-clusters

- id: loopback
