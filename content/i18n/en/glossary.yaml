- id: underlay
  term: underlay
  short: "The physical or base network delivering packets between infrastructure devices."
  note: fib-i-whiteboxy

- id: fib
  term: FIB
  short: "The device table from which hardware takes its ready-made packet-forwarding decision."
  note: fib-i-whiteboxy

- id: whitebox
  term: whitebox
  short: "A switch with open or replaceable software, usually cheaper and more flexible than proprietary equipment."
  note: fib-i-whiteboxy

- id: overlay
  term: overlay
