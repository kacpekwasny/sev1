title: "Spine-leaf fabric"
summary: >
  Three spines, four leaves, and four racks. Every leaf connects to every spine,
  giving equal hop counts between servers and three parallel paths.
note: centrum-obliczeniowe

# Sequential /31 allocations for fabric cables, as in a configuration generator.
fabric_net: 10.255.0.0/16

tiers:
  - id: spine
    label: "Spine"
    devices:
      - { name: spine1, asn: 65001, loopback: 10.0.0.1 }
      - { name: spine2, asn: 65002, loopback: 10.0.0.2 }
      - { name: spine3, asn: 65003, loopback: 10.0.0.3 }

  - id: leaf
    label: "Leaf (ToR)"
    devices:
      - { name: leaf1, asn: 65101, loopback: 10.0.1.1, subnet: 10.1.1.0/24 }
      - { name: leaf2, asn: 65102, loopback: 10.0.1.2, subnet: 10.1.2.0/24 }
      - { name: leaf3, asn: 65103, loopback: 10.0.1.3, subnet: 10.1.3.0/24 }
      - { name: leaf4, asn: 65104, loopback: 10.0.1.4, subnet: 10.1.4.0/24 }

  - id: rack
    label: "Rack"
    kind: endpoint
    devices:
      - { name: szafa1, subnet: 10.1.1.0/24, note: "~20 servers" }
      - { name: szafa2, subnet: 10.1.2.0/24, note: "~20 servers" }
      - { name: szafa3, subnet: 10.1.3.0/24, note: "~20 servers" }
      - { name: szafa4, subnet: 10.1.4.0/24, note: "~20 servers" }

# Every leaf connects to every spine; adding a device generates its cables, ports, and addresses.
mesh:
  - { from: leaf, to: spine }

pairs:
  - { from: rack, to: leaf }

route:
  from: leaf1
  to: leaf3
  prefix: 10.1.3.0/24
  note: >
    Rack 3's prefix reaches leaf 1 through each spine, with equal AS-path lengths.
    All three paths remain in the table, and ECMP distributes traffic among them.
    The choice is made once per flow using an address/port hash, keeping packets
    of one connection in order. Losing one spine removes a third of the capacity,
    rather than connectivity.
