title: "Fabric spine-leaf"
summary: >
  Trzy spine'y, cztery leafy, cztery szafy. Każdy leaf wpięty w każdy spine - stąd
  równa liczba przeskoków między dowolnymi dwoma serwerami i trzy równoległe drogi.
note: centrum-obliczeniowe

# Z tej puli lecą /31 na kable fabrika, po kolei. Tak samo robi to generator
# konfiguracji - nikt nie wpisuje adresów łączy ręcznie.
fabric_net: 10.255.0.0/16

tiers:
  - id: spine
    label: "Spine"
    devices:
      - { name: spine1, asn: 65001, loopback: 10.0.0.1 }
      - { name: spine2, asn: 65002, loopback: 10.0.0.2 }
      - { name: spine3, asn: 65003, loopback: 10.0.0.3 }

  - id: leaf
    label: "Leaf (ToR)"
    devices:
      - { name: leaf1, asn: 65101, loopback: 10.0.1.1, subnet: 10.1.1.0/24 }
      - { name: leaf2, asn: 65102, loopback: 10.0.1.2, subnet: 10.1.2.0/24 }
      - { name: leaf3, asn: 65103, loopback: 10.0.1.3, subnet: 10.1.3.0/24 }
      - { name: leaf4, asn: 65104, loopback: 10.0.1.4, subnet: 10.1.4.0/24 }

  - id: rack
    label: "Szafa"
    kind: endpoint
    devices:
      - { name: szafa1, subnet: 10.1.1.0/24, note: "~20 serwerów" }
      - { name: szafa2, subnet: 10.1.2.0/24, note: "~20 serwerów" }
      - { name: szafa3, subnet: 10.1.3.0/24, note: "~20 serwerów" }
      - { name: szafa4, subnet: 10.1.4.0/24, note: "~20 serwerów" }

# Cała treść topologii spine-leaf mieści się w tej jednej linijce: każdy leaf
# do każdego spine'a. Dopisanie czwartego spine'a to dopisanie urządzenia
# wyżej - kable, porty i adresy dorobią się same.
mesh:
  - { from: leaf, to: spine }

pairs:
  - { from: rack, to: leaf }

route:
  from: leaf1
  to: leaf3
  prefix: 10.1.3.0/24
  note: >
    Prefiks szafy 3 przychodzi do leafa 1 od każdego spine'a osobno, za każdym razem
    z AS-path tej samej długości. Żaden nie jest lepszy, więc w tablicy zostają
    wszystkie trzy i ruch rozkłada się po nich przez ECMP - decyzja zapada raz na
    przepływ, po hashu z adresów i portów, żeby pakiety jednego połączenia nie
    wyprzedzały się nawzajem. Wyłączenie jednego spine'a zabiera jedną trzecią
    przepustowości, a nie łączność.
